name: CI - Lint & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: "check"

  test:
    name: Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_test.txt
          jq -r '.requirements[]' custom_components/varta_modbus/manifest.json | xargs -r pip install
      - name: Run Pytest
        run: pytest --cov
