[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

markers = [
    "config_flow",
]

addopts = [
    "-ra",
]

[tool.coverage.run]
source = [
    "custom_components/varta_modbus",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
